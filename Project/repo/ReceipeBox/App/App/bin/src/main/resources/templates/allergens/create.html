<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Allergen — Admin</title>
<link rel="stylesheet" th:href="@{/css/global-style.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div
		th:replace="~{fragments/header :: global-header('admin-allergens')}"></div>

	<main class="container">

		<div class="form-card">
			<div class="form-title-area">
				<h2>Register New Allergen</h2>
				<p>Add a food allergen to the system to help users filter their
					recipes safely.</p>
			</div>

			<form th:action="@{/admin/allergy/save}" th:object="${allergen}"
				method="POST">
				<input type="hidden" th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}" />
				<!-- <input type="hidden" th:field="*{allergenId}">-->
				<div class="form-group">
					<label class="form-label">Allergen Name</label> <input type="text"
						th:field="*{name}" class="form-control" required>
				</div>
				<div class="form-action-row"
					style="margin-top: 20px; display: flex; gap: 10px;">
					<a th:href="@{/admin/allergy}" class="btn-global btn-secondary">Cancel</a>
					<button type="submit" class="btn-global btn-primary">Save
						Allergen</button>
				</div>
			</form>

		</div>

	</main>

</body>
</html>
