<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Favorites — RecipeBox</title>
    <link rel="stylesheet" th:href="@{/css/global-style.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/user-dashboard-style.css}">
</head>
<body>


    <div th:replace="~{fragments/user-header :: global-header('favorites')}"></div>

    <main class="container" style="margin-top: 24px;">
        
        <div class="crud-header" style="margin-bottom: 32px;">
            <div class="crud-title">
                <h2>Saved Cookbooks & Favorites</h2>
                <p>Quickly access the recipes you love and cook most frequently.</p>
            </div>
        </div>

        <!-- ASYMMETRICAL RECIPE SHOWCASE GRID -->
        <div class="recipe-showcase-grid" th:if="${!#lists.isEmpty(favoriteRecipes)}">
            
            <div th:each="fav, iterStat : ${favoriteRecipes}" 
                 th:class="${iterStat.first} ? 'recipe-card large-feature-card' : 'recipe-card standard-card'">
                
                <div class="card-image-box">
                 
                    <img th:src="${#strings.isEmpty(fav.recipe.imageUrl)} ? '/images/default-recipe.jpg' : ${fav.recipe.imageUrl}" 
                         alt="Recipe Artwork">
                    
                    <span class="card-floating-tag" th:text="${fav.recipe.mealType}">Dinner</span>
                    
                 
                    <form th:action="@{/user/favorites/toggle/{id}(id=${fav.recipe.recipeId})}" method="POST">
                        <button type="submit" class="btn-favorite-heart favorited" title="Remove from Favorites">
                            <span class="heart-icon" style="color: #ef4444;">❤️</span>
                        </button>
                    </form>
                </div>

                <div class="card-details-box">
                    <div class="meta-row-top">
                        <span class="cooking-duration">
                            ⏱️ <span th:text="${fav.recipe.cookingTimeMin}">30</span> Mins
                        </span>
                        <span class="difficulty-indicator">Saved</span>
                    </div>
                    
                    <h3 class="recipe-display-title" th:text="${fav.recipe.name}">Recipe Title</h3>
                    <p class="recipe-display-desc" th:text="${fav.recipe.description}">Description</p>
                    
                    <div class="card-action-footer">
                        <a th:href="@{/user/recipes/view/{id}(id=${fav.recipe.recipeId})}" class="btn-view-recipe">
                            View Recipe <span>➔</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(favoriteRecipes)}" class="card-table-wrapper" style="text-align: center; padding: 60px 20px;">
            <span style="font-size: 48px; display: block; margin-bottom: 16px;">❤️</span>
            <h3 style="color: var(--dark-slate); font-weight: 700; margin-bottom: 6px;">No Favorites Saved Yet</h3>
            <p style="color: #64748b; font-size: 14px;">Tap the heart icon on any recipe thumbnail within your dashboard to collect them here.</p>
        </div>

    </main>

</body>
</html>
