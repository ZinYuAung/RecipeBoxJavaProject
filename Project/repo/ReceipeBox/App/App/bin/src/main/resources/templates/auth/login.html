<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FlavorFold</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  
  <style>
  
    .password-toggle-icon {
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div th:replace="~{fragments/header :: global-header('login')}"></div>

  <main class="auth-page-container">
    <div class="split-auth-card">

      <!-- LEFT SIDE: Image Banner -->
      <div class="auth-banner-side" th:style="'background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.45)), url(' + @{/uploads/login-bg.jpg} + ');'">
        <div class="banner-overlay-content">
          <h2>Welcome Back to Your Kitchen Hub.</h2>
          <p>Log in to access your saved cooking variations, shopping lists, and custom recipe creations.</p>
        </div>
      </div>
      
      <!-- RIGHT SIDE: Clean Login Form -->
      <div class="auth-form-side">
        <div class="form-wrapper">
          <h2>Welcome Back</h2>
          <p class="form-subtitle">Log in to access your digital recipe box.</p>
          
          <div th:if="${param.error}" style="color: #ef4444; background-color: #fef2f2; border: 1px solid #fee2e2; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; font-weight: 500;">
              Invalid email or password. Please try again.
          </div>
          
          <form th:action="@{/login}" method="POST">
            <div class="form-group">
              <label for="username">Email Address</label>
              <input type="text" id="username" name="username" class="form-control" required placeholder="email@example.com">
            </div>
            
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-input-wrapper">
              
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
          
                <span id="togglePassword" class="password-toggle-icon">👁️</span>
              </div>
            </div>
            
            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" name="remember-me"> Remember Me
              </label>
              <a th:href="@{/forgot-password}" class="forgot-password-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="auth-submit-btn">Log In →</button>
          </form>
          
          <div class="auth-footer">
            Don't have an account? <a th:href="@{/signup}">Sign up here</a>
          </div>
        </div>
      </div>
      
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            this.textContent = type === 'password' ?  '🙈':"👁️";
        });
    });
  </script>

</body>
</html>
