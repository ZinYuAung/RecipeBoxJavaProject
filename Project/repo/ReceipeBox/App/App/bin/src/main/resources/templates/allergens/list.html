<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Manage Allergens — Admin</title>
<link rel="stylesheet" th:href="@{/css/global-style.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/alert.css}">
</head>
<body>
	<div
		th:replace="~{fragments/header :: global-header('admin-allergens')}"></div>

	<main class="container">
		<div class="crud-header">
			<div class="crud-title">
				<h2>Allergens Database</h2>
				<p>Manage the list of allergens to ensure user safety.</p>
			</div>
			<a th:href="@{/admin/allergy/create}" class="btn-global btn-primary">➕
				Add New Allergen</a>
		</div>

		<div class="card-table-wrapper">
			<table class="global-table">
				<thead>
					<tr>
						<th>NO</th>
						<th>Name</th>
						<th style="text-align: right;">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="a, iterStat : ${allergens}">
						<td th:text="${iterStat.index + 1}"></td>
						<td th:text="${a.name}" style="font-weight: 600;"></td>
						<td>
							<div class="btn-action-group"
								style="justify-content: flex-end; display: flex; gap: 8px;">
								<a th:href="@{/admin/allergy/view/{id}(id=${a.allergenId})}" class="btn-icon-only" title="View Details">👁️</a>
								
								<!-- Edit -->
								<a th:href="@{/admin/allergy/edit/{id}(id=${a.allergenId})}"
									class="btn-icon-only">✏️</a>

								<!-- Delete Button (Modal ခေါ်ရန်သာ) -->
								<button type="button" class="btn-icon-only"
									style="border: none; cursor: pointer; background: none; font-size: 18px;"
									th:attr="data-id=${a.allergenId}, data-name=${a.name}"
									onclick="openDeleteCard(this)">🗑️</button>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
	<div id="deleteModal" class="modal-overlay">
		<div class="modal-card">

			<h3
				style="margin: 0 0 10px 0; font-size: 20px; font-weight: 800; color: var(--dark-slate);">
				Confirm Deletion</h3>

			<p
				style="margin: 0 0 24px 0; font-size: 14px; color: #64748b; line-height: 1.5;">
				<strong id="modalTargetName" style="color: var(--primary-color);">
					this allergen </strong>? Once confirmed, this profile record will disappear
				from the board system.
			</p>

			<form id="modalDeleteForm" method="POST">
				<input type="hidden" th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}" />

				<div class="form-action-row"
					style="margin-top: 0; padding-top: 0; border-top: none;">

					<button type="button" class="btn-global btn-secondary"
						onclick="closeDeleteCard()">Cancel</button>

					<button type="submit" class="btn-global btn-danger"
						style="margin-left: 12px;">Delete</button>

				</div>

			</form>

		</div>
	</div>
	<script>
		const modal = document.getElementById("deleteModal");
		const modalForm = document.getElementById("modalDeleteForm");
		const modalTargetName = document.getElementById("modalTargetName");

		function openDeleteCard(button) {

			const id = button.dataset.id;
			const name = button.dataset.name;

			modalTargetName.textContent = "'" + name + "'";

			modalForm.action = "/admin/allergy/delete/" + id;

			modal.classList.add("active");
		}

		function closeDeleteCard() {

			modal.classList.remove("active");
		}

		window.onclick = function(event) {

			if (event.target === modal) {
				closeDeleteCard();
			}

		}
	</script>
</body>
</html>
