<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>BMI Calculator</title>
<link rel="stylesheet" th:href="@{/css/global-style.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<!-- <div th:replace="~{fragments/header :: global-header('/user/bmi')}"></div> -->
	<div th:replace="~{fragments/header :: global-header('/user/bmi')}"></div>
	

	<main class="container">

		<div th:if="${param.success}"
			style="padding: 15px; background: #d1fae5; color: #065f46; margin-bottom: 20px; border-radius: 8px; text-align: center; max-width: 500px; margin-left: auto; margin-right: auto;">
			BMI record saved successfully!</div>

		<div class="form-card" style="max-width: 500px; margin: 0 auto;">
			<div class="form-title-area">
				<h2>BMI Calculator</h2>
				<p>Enter your weight and height to calculate your Body Mass
					Index.</p>
			</div>

			<form th:action="@{/user/bmi/calculate}" method="POST">
				<div class="form-group">
					<label class="form-label">Weight (kg)</label> <input type="number"
						name="weight" step="0.1" class="form-control"
						placeholder="e.g. 70.5" required>
				</div>

				<div class="form-group">
					<label class="form-label">Height (cm)</label> <input type="number"
						name="height" step="0.1" class="form-control"
						placeholder="e.g. 175" required>
				</div>

				
               <input type="hidden" name="userId" th:value="${userId}">

				<!-- age,gender -->
				<div class="form-group">
					<label class="form-label">Age</label> <input type="number"
						name="age" class="form-control" placeholder="e.g. 25" required>
				</div>

				<div class="form-group">
					<label class="form-label">Gender</label>
					<div style="display: flex; gap: 20px; margin-top: 8px;">
						<label style="cursor: pointer;"> <input type="radio"
							name="gender" value="Male" required> Male
						</label> <label style="cursor: pointer;"> <input type="radio"
							name="gender" value="Female" required> Female
						</label>
					</div>
				</div>

				<!-- allergen -->
				<div class="form-group">
					<label class="form-label">Associated Allergens</label>
					<div
						style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px;">
						<div style="display: flex; align-items: center; gap: 8px;">
							<input type="checkbox" name="allergenIds" value="1"
								id="allergen_1"
								style="accent-color: var(--primary-color); width: 16px; height: 16px; cursor: pointer;">
							<label for="allergen_1"
								style="font-size: 14px; color: #334155; cursor: pointer; font-weight: 500;">Peanuts</label>
						</div>
						<div style="display: flex; align-items: center; gap: 8px;">
							<input type="checkbox" name="allergenIds" value="2"
								id="allergen_2"
								style="accent-color: var(--primary-color); width: 16px; height: 16px; cursor: pointer;">
							<label for="allergen_2"
								style="font-size: 14px; color: #334155; cursor: pointer; font-weight: 500;">Dairy</label>
						</div>
					</div>
				</div>


				<div class="form-action-row"
					style="border-top: none; margin-top: 20px;">
					<button type="submit" class="btn-global btn-primary"
						style="width: 100%;">Calculate BMI</button>
				</div>
			</form>
		</div>
	</main>

</body>
</html>
