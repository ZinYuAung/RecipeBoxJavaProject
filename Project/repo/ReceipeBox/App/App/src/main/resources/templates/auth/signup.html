<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head
	th:replace="~{fragments/head :: common-head('Sign Up — RecipeBox')}">
</head>
<body>

	<!-- Global Header Component -->
	<div th:replace="~{fragments/header :: global-header('signup')}"></div>

	<!-- Page wrapper containing the centered split-card -->
	<main class="auth-page-container">

		<div class="split-auth-card">

			<div class="auth-banner-side"
				th:style="'background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.45)), url(' + @{/uploads/signup-bg.jpg} + ');'">
				<div class="banner-overlay-content">
					<h2>Join Our Kitchen Hub Today.</h2>
					<p>Create an account to discover recipes, keep track of your
						grocery lists, and build your digital recipe box.</p>
				</div>
			</div>


			<div class="auth-form-side">
				<div class="form-wrapper">
					<h2>Create Your Account</h2>
					<p class="form-subtitle">Join us to start managing and sharing
						your recipes.</p>

					<form th:action="@{/signup}" method="POST">
						<!-- First Name & Last Name Side-by-Side Row -->
						<div style="display: flex; gap: 16px; margin-bottom: 22px;">
							<div style="flex: 1; margin-bottom: 0;" class="form-group">
								<label for="firstName" class="form-label">First Name</label> 
								<input type="text"
									id="firstName" name="firstName" class="form-control" 
									placeholder="John" th:value="${firstName}">
								<!-- Inline Error for First Name -->
								<span th:if="${firstNameError}" th:text="${firstNameError}" 
								      style="color: #ef4444; font-size: 12px; margin-top: 4px; display: block;"></span>
							</div>
							
							<div style="flex: 1; margin-bottom: 0;" class="form-group">
								<label for="lastName" class="form-label">Last Name</label> 
								<input type="text"
									id="lastName" name="lastName" class="form-control" 
									placeholder="Doe" th:value="${lastName}">
							</div>
						</div>

						<!-- Email Input -->
						<div class="form-group">
							<label for="email" class="form-label">Email Address</label> 
							<input type="email"
								id="email" name="email" class="form-control" 
								placeholder="you@example.com" th:value="${email}">
							<!-- Inline Error for Email -->
							<span th:if="${emailError}" th:text="${emailError}" 
							      style="color: #ef4444; font-size: 12px; margin-top: 4px; display: block;"></span>
						</div>

						<!-- Password Input -->
						<div class="form-group">
							<label for="password" class="form-label">Password</label>
							<input type="password" id="password" name="password"
								class="form-control" placeholder="Create password">
							<!-- Inline Error for Password -->
							<span th:if="${passwordError}" th:text="${passwordError}" 
							      style="color: #ef4444; font-size: 12px; margin-top: 4px; display: block;"></span>
						</div>

						<!-- Confirm Password Input -->
						<div class="form-group">
							<label for="confirmPassword" class="form-label">Confirm Password</label>
							<input type="password" id="confirmPassword" name="confirmPassword"
								class="form-control" placeholder="Confirm password">
							<!-- Inline Error for Confirm Password -->
							<span th:if="${confirmPasswordError}" th:text="${confirmPasswordError}" 
							      style="color: #ef4444; font-size: 12px; margin-top: 4px; display: block;"></span>
						</div>

						<button type="submit" class="auth-submit-btn"
							style="margin-top: 10px;">Get Started →</button>
					</form>

					<div class="auth-footer">
						Already have an account? <a th:href="@{/login}">Log in instead</a>
					</div>
				</div>
			</div>

		</div>

	</main>

</body>
</html>
