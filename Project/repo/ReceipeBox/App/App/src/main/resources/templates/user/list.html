<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head
	th:replace="~{fragments/head :: common-head('Manage User — RecipeBox')}">
</head>
<body
	style="display: flex; flex-direction: column; min-height: 100vh; margin: 0;">

	<div
		th:replace="~{fragments/admin-header :: global-header('admin-users')}"></div>

	<main class="list-container">
		<div th:if="${message}" id="alertMessage" class="alert-msg">
			<i class="bi bi-check-circle-fill"></i> <span th:text="${message}">User!</span>
		</div>
		<!-- error,success alert box -->
		<div th:if="${errorMessage}" id="errorAlert" class="alert-msg-danger">
			<i class="bi bi-exclamation-triangle"></i> <span
				th:text="${errorMessage}">Error message</span>
		</div>
		<div>
			<div class="crud-header">
				<div class="crud-title">
					<h2>Users Management</h2>
					<p>Managing system user accounts</p>
				</div>

				<!-- Search Form & Add User Wrapper -->
				<div
					style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
					<form th:action="@{/admin/users}" method="GET"
						style="margin-bottom: 0;">
						<div class="global-search-box">
							<!-- Orange Search Icon -->
							<i class="bi bi-search"></i>

							<!-- Search Input Field -->
							<input type="text" id="searchInput" name="keyword"
								th:value="${keyword}" class="form-control"
								placeholder="Search users..." aria-label="Search"
								oninput="toggleClearButton(this)">

							<!-- Clear Button Icon -->
							<button type="button" id="clearBtn"
								class="global-search-clear-btn" onclick="clearSearch(this)"
								th:style="${keyword != null and !#strings.isEmpty(keyword)} ? 'display: block;' : 'display: none;'"
								title="Clear search">
								<i class="bi bi-x-circle-fill"></i>
							</button>
						</div>
					</form>

					<a th:href="@{/admin/register}" class="btn-global btn-primary">➕
						Create User</a>
				</div>
			</div>

			<!-- Card Wrapper with Responsive Scrollable Table Container -->
			<div class="card-table-wrapper">
				<div class="table-responsive">
					<table class="global-table">
						<thead>
							<tr>
								<th>No</th>
								<th>Name</th>
								<th>Email</th>
								<th>Role</th>
								<th>Status</th>
								<th>Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="user, stat : ${users}">
								<td th:text="${stat.count}">1</td>
								<td th:text="${user.name}">John Doe</td>
								<td th:text="${user.email}">john@example.com</td>
								<td th:text="${user.role}">Admin</td>
								<td><span
									th:classappend="${user.isActive} ? 'badge badge-success' : 'badge badge-danger'"
									th:text="${user.isActive} ? 'Active' : 'Inactive'">Active</span>
								</td>
								<td>
									<div class="btn-action-group">
										<a th:href="@{/admin/info/{id}(id=${user.userId})}"
											class="btn-global btn-secondary btn-pill-sm" title="View">
											<i class="bi bi-eye"></i>View
										</a> <a th:href="@{/admin/edit/{id}(id=${user.userId})}"
											class="btn-global btn-primary btn-pill-sm" title="Edit">
											<i class="bi bi-pencil-square"></i> Edit
										</a>

										<!-- Fixed Click Handler -->
										<button type="button"
											class="btn-global btn-danger btn-pill-sm"
											th:if="${user.isActive and session.loginUser != null and session.loginUser.role.name() == 'SUPERADMIN' and user.userId != session.loginUser.userId}"
											th:attr="onclick=|openDeleteCard('${user.userId}', '${#strings.escapeJavaScript(user.name)}')|"
											style="background-color: #ef4444; color: white;">
											<i class="bi bi-trash3"></i> Delete
										</button>
									</div>
								</td>
							</tr>

							<tr th:if="${#lists.isEmpty(users)}">
								<td colspan="6"
									style="text-align: center; color: #64748b; padding: 40px;">
									No users found.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

		</div>

		<div
			style="display: flex; justify-content: center; margin-top: auto; padding-top: 20px; padding-bottom: 20px;">
			<nav aria-label="Page navigation"
				style="background: #ffffff; border: 1px solid #e5e7eb; border-radius: 50rem; padding: 6px 16px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); display: flex; align-items: center; gap: 8px;">

				<!-- Previous Button -->
				<a th:if="${userPage.hasPrevious()}"
					th:href="@{/admin/users(page=${userPage.number - 1}, size=${userPage.size}, keyword=${keyword})}"
					style="color: #4b5563; text-decoration: none; padding: 4px 8px; font-size: 15px; font-weight: 600;">&lt;</a>
				<span th:unless="${userPage.hasPrevious()}"
					style="color: #d1d5db; padding: 4px 8px; font-size: 15px; cursor: not-allowed;">&lt;</span>

				<!-- Page Numbers Loop -->
				<th:block
					th:with="current=${userPage.number}, total=${userPage.totalPages == 0 ? 1 : userPage.totalPages}">
					<span th:each="i : ${#numbers.sequence(0, total - 1)}"> <th:block
							th:if="${i == 0 || i == total - 1 || (i >= current - 1 && i <= current + 1)}">
							<a th:if="${i != current}"
								th:href="@{/admin/users(page=${i}, size=${userPage.size}, keyword=${keyword})}"
								th:text="${i + 1}"
								style="color: #4b5563; text-decoration: none; padding: 6px 10px; font-size: 14px; font-weight: 500; border-radius: 50%;">1</a>

							<!-- Active Page Pill Style -->
							<span th:if="${i == current}" th:text="${i + 1}"
								style="background-color: #6366f1; color: #ffffff; padding: 6px 12px; font-size: 14px; font-weight: 600; border-radius: 50rem; display: inline-block; box-shadow: 0 2px 4px rgba(99, 102, 241, 0.4);">1</span>
						</th:block> <span
						th:if="${(i == current - 2 && i > 0) || (i == current + 2 && i < total - 1)}"
						style="color: #9ca3af; padding: 0 4px; font-size: 14px;">...</span>
					</span>
				</th:block>

				<!-- Next Button -->
				<a th:if="${userPage.hasNext()}"
					th:href="@{/admin/users(page=${userPage.number + 1}, size=${userPage.size}, keyword=${keyword})}"
					style="color: #4b5563; text-decoration: none; padding: 4px 8px; font-size: 15px; font-weight: 600;">&gt;</a>
				<span th:unless="${userPage.hasNext()}"
					style="color: #d1d5db; padding: 4px 8px; font-size: 15px; cursor: not-allowed;">&gt;</span>

			</nav>
		</div>
	</main>

	<!-- Modal -->
	<div id="deleteModal" class="modal-overlay">
		<div class="modal-card">
			<h3 style="margin: 0 0 10px 0; font-size: 20px; font-weight: 800;">Confirm
				Deletion</h3>
			<p style="margin: 0 0 24px 0; font-size: 14px; color: #64748b;">
				Are you sure you want to deactivate user <strong
					id="modalTargetName" style="color: var(--primary-color);"></strong>?
			</p>

			<div
				style="display: flex; justify-content: flex-end; border-top: none; gap: 12px;">
				<button type="button" class="btn-global btn-secondary"
					onclick="closeDeleteCard()">
					<i class="bi bi-x-circle"></i>Cancel
				</button>

				<a id="modalDeleteLink" href="#" class="btn-global btn-danger"><i
					class="bi bi-trash3"></i> Delete </a>
			</div>
		</div>
	</div>

	<script type="text/javascript">
		const modal = document.getElementById('deleteModal');
		const modalNameSpan = document.getElementById('modalTargetName');
		const modalDeleteLink = document.getElementById('modalDeleteLink');

		function openDeleteCard(id, name) {
			modalNameSpan.textContent = "'" + name + "'";
			modalDeleteLink.href = "/admin/delete/" + id;
			modal.classList.add('active');
		}

		function closeDeleteCard() {
			modal.classList.remove('active');
		}

		window.onclick = function(event) {
			if (event.target === modal) {
				closeDeleteCard();
			}
		}

		// Clear Search Input Scripts
		function toggleClearButton(input) {
			const clearBtn = input.parentNode.querySelector('#clearBtn');
			if (input.value.trim().length > 0) {
				clearBtn.style.display = 'block';
			} else {
				clearBtn.style.display = 'none';
			}
		}

		function clearSearch(button) {
			const inputGroup = button.parentNode;
			const input = inputGroup.querySelector('input');
			input.value = '';
			button.style.display = 'none';
			input.form.submit();
		}

		document.addEventListener("DOMContentLoaded", function() {
			const searchInputs = document.querySelectorAll("input[name='keyword']");
			searchInputs.forEach(input => {
				toggleClearButton(input);
			});
		});
		
		setTimeout(() => {
		    const alert = document.getElementById("alertMessage");
		    if (alert) {
		        alert.classList.add("alert-msg-hide");
		        setTimeout(() => {
		            alert.remove();
		        }, 5000);
		    }
		}, 700);
			
			setTimeout(() => {
		    const alert = document.getElementById("errorAlert");
		    if (alert) {
		        alert.classList.add("alert-msg-hide");
		        setTimeout(() => {
		            alert.remove();
		        }, 5000);
		    }
		}, 700);
	</script>
</body>
</html>
