<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head
	th:replace="~{fragments/head :: common-head('Edit Profile — RecipeBox')}">
</head>
<head>
<style>
.form-row-2col {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 16px;
}
.alert-error {
	color: #ef4444;
	background-color: #fef2f2;
	border: 1px solid #fee2e2;
	padding: 12px;
	border-radius: 8px;
	margin-bottom: 16px;
	font-size: 14px;
	font-weight: 500;
}
</style>
</head>
<body>

	<div th:replace="~{fragments/admin-header :: global-header('admin-profile')}"></div>

	<main class="container" style="margin-top: 32px;">

		<div class="form-card">
			<div class="form-title-area">
				<h2>Edit Admin Profile</h2>
				<p th:text="'Update account settings for ' + ${user.name}">Update account settings.</p>
			</div>

            <div th:if="${errorMessage}" class="alert-error">
                <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}">Error</span>
            </div>
            <div th:if="${message}" class="alert-msg" style="color: #10b981; background: #ecfdf5; padding: 12px; border-radius: 8px; margin-bottom: 16px;">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${message}">Success</span>
            </div>

			<form th:action="@{/admin/profile/update}" th:object="${user}" method="POST">
				
				<input type="hidden" th:field="*{userId}"> 

				<div class="form-group" style="margin-bottom: 16px;">
					<label class="form-label">Full Name</label> 
					<input type="text" th:field="*{name}" class="form-control" required>
				</div>

				<div class="form-group" style="margin-bottom: 16px;">
					<label class="form-label">Email Address</label> 
					<input type="email" th:field="*{email}" class="form-control" required>
				</div>
				
				<div style="border-top: 1px solid #eee; margin-top: 20px; padding-top: 20px;">
					<h3 style="font-size: 16px; margin-bottom: 10px;">Change Password</h3>
					<p style="font-size: 13px; color: #666; margin-bottom: 15px;">Leave blank if you do not want to change your password.</p>

					<div class="form-group" style="margin-bottom: 15px;">
						<label class="form-label">Current Password</label> 
						<input type="password" name="currentPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
					</div>

					<div class="form-row-2col">
						<div class="form-group">
							<label class="form-label">New Password</label> 
							<input type="password" name="newPassword" class="form-control" placeholder="••••••••" autocomplete="new-password">
						</div>
						
						<div class="form-group">
							<label class="form-label">Confirm New Password</label> 
							<input type="password" name="confirmPassword" class="form-control" placeholder="••••••••" autocomplete="new-password">
						</div>
					</div>
				</div>

				<div class="form-action-row" style="margin-top: 20px; display: flex; gap: 12px; justify-content: flex-end;">
					<a th:href="@{/admin/profile}" class="btn-global btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
					<button type="submit" class="btn-global btn-primary">
					    <i class="bi bi-check-circle-fill"></i> Save Changes
                    </button>
				</div>
			</form>
		</div>

	</main>
</body>
</html>
