<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <header th:fragment="global-header(page)" class="global-header">
        <div class="header-left">
            <a th:href="@{/home}" class="global-logo"> 
                <span class="logo-icon">🍳</span>
                <span class="logo-text">Recipe<span>Box</span></span>
            </a>
        </div>
            <button type="button" class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation">
            <i class="bi bi-list"></i>
        </button>
        <div class="header-right" id="headerRightMenu">
        
            <div class="global-search-box" th:classappend="${session.loginUser == null} ? 'hidden'">
                <form th:action="@{/user/recipes/search}" method="GET" style="display: flex; align-items: center; width: 100%; margin: 0;">
                    <!-- Orange Search Icon -->
                    <i class="bi bi-search"></i>

                    <!-- Search Input Field -->
                    <input type="text" id="searchInput" name="query"
                        th:value="${param.query}"
                        class="form-control search-input"
                        placeholder="Search recipes or ingredients..." aria-label="Search"
                        oninput="toggleClearButton(this)">

                    <!-- Clear Button Icon -->
                    <button type="button" id="clearBtn" class="global-search-clear-btn" onclick="clearSearch(this)"
                        th:style="${param.query != null and !#strings.isEmpty(param.query)} ? 'display: block;' : 'display: none;'"
                        title="Clear search">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </form>
            </div>

            <nav class="header-nav-right">
                <div class="nav-group">
                    <a th:href="@{/user/dashboard}" class="nav-link"
                       th:classappend="${page == 'user-dashboard'} ? 'active'">Dashboard</a> 
                    <a th:href="@{/user/favorite-recipes}" class="nav-link"
                       th:classappend="${page == 'favorites'} ? 'active'">Favorites</a> 
                    <a th:href="@{/user/bmi}" class="nav-link"
                       th:classappend="${page == 'bmi'} ? 'active'">BMI</a> 
                    <a th:href="@{/user/saved-plans}" class="nav-link"
                       th:classappend="${page == 'saved-plans'} ? 'active'">📊My Diet Journey</a>
                </div>
            </nav>

            <div th:if="${session.loginUser != null}" class="user-profile-controls">
                <button type="button" class="profile-dropdown-btn" id="adminDropdownBtn">
                    <i class="bi bi-person-circle user-avatar-icon"></i> 
                    <span class="welcome-user-name" th:text="${session.loginUser.name}">User</span>
                    <i class="bi bi-chevron-down dropdown-chevron"></i>
                </button>

                <div class="profile-dropdown-menu" id="adminDropdownMenu">
                    <a th:href="@{/user/profile}" class="dropdown-item"> 
                        <i class="bi bi-person"></i> Profile
                    </a>
                    <div class="dropdown-divider"></div>
                    <form th:action="@{/logout}" method="POST" style="margin: 0;">
                        <button type="submit" class="dropdown-item logout-text">
                            <i class="bi bi-box-arrow-right"></i> Log Out
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            (function() {
                document.addEventListener('click', function(e) {
                	
                	// Handle Mobile Menu Toggle
                    const mobileToggle = e.target.closest('#mobileMenuToggle');
                    const headerRightMenu = document.getElementById('headerRightMenu');
                    
                    if (mobileToggle && headerRightMenu) {
                        e.stopPropagation();
                        headerRightMenu.classList.toggle('mobile-open');
                        const icon = mobileToggle.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('bi-list');
                            icon.classList.toggle('bi-x');
                        }
                        return;
                    }
                	
                    const btn = e.target.closest('#adminDropdownBtn');
                    const menu = document.getElementById('adminDropdownMenu');

                    if (btn && menu) {
                        e.stopPropagation();
                        menu.classList.toggle('show');
                    } else if (menu && !menu.contains(e.target)) {
                        menu.classList.remove('show');
                    }
                });
            })();

            function toggleClearButton(input) {
                const clearBtn = document.getElementById('clearBtn');
                if (clearBtn) {
                    if (input.value.trim().length > 0) {
                        clearBtn.style.display = 'block';
                    } else {
                        clearBtn.style.display = 'none';
                    }
                }
            }

            function clearSearch(button) {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.value = '';
                }
                button.style.display = 'none';
                window.location.href = '/user/dashboard';
            }
        </script>
    </header>

</body>
</html>
