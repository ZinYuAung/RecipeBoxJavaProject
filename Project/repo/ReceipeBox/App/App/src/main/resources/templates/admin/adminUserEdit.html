<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head
	th:replace="~{fragments/head :: common-head('Edit User — RecipeBox')}">
</head>
<head>
<style>
.form-row-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}
.readonly-field {
    background-color: #f1f5f9;
    color: #64748b;
    cursor: not-allowed;
}
</style>
</head>
<body>

    <!-- Uses admin-header fragment -->
    <div th:replace="~{fragments/admin-header :: global-header('admin-users')}"></div>

    <main class="container" style="margin-top: 32px;">

        <div class="form-card">
            <div class="form-title-area">
                <h2>Edit User Controls</h2>
                <p th:text="'Managing permissions for User #' + ${user.userId}">
                   Update account settings.
                </p>
            </div>

            <form th:action="@{/admin/update}" th:object="${user}" method="POST">
                
                <input type="hidden" th:field="*{userId}">

                <!-- Full Name -->
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label">Full Name</label> 
                    <input type="text" th:field="*{name}" class="form-control readonly-field" required>
                </div>

                <!-- Email Address (Read-Only) -->
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label">Email Address (Read-only)</label> 
                    <input type="email" th:field="*{email}" class="form-control readonly-field" readonly>
                </div>

                <!-- System Role & Active Status -->
                <div class="form-row-2col" style="margin-bottom: 24px;">
                    
                    <!-- System Role: Restricted (Disabled for regular Admins) -->
                    <div class="form-group">
                        <label class="form-label">System Role 
                            <span th:if="${session.loginUser != null and session.loginUser.role.name() != 'SUPERADMIN'}" style=" color: #ef4444;">(SuperAdmin only)</span>
                        </label> 
                        <select th:field="*{role}" class="form-control" 
                                th:disabled="${session.loginUser != null and session.loginUser.role.name() != 'SUPERADMIN'}">
                            <option value="USER">User</option>
                            <option value="ADMIN">Admin</option>
                           
                        </select>
                        <!-- Hidden field to pass role value safely if disabled -->
                        <input type="hidden" th:if="${session.loginUser != null and session.loginUser.role.name() != 'SUPERADMIN'}" th:field="*{role}" />
                    </div>

                    <!-- Account Status: Editable by both Admins and SuperAdmins -->
                    <div class="form-group">
                        <label class="form-label">Account Status</label> 
                        <select th:field="*{isActive}" class="form-control">
                            <option value="true">Active (Enabled)</option>
                            <option value="false">Inactive (Disabled)</option>
                        </select>
                    </div>

                </div>

                <!-- Form Buttons -->
                <div class="form-action-row" style="display: flex; gap: 12px; justify-content: flex-end;">
                    <a th:href="@{/admin/users}" class="btn-global btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn-global btn-primary">
                        <i class="bi bi-check-circle-fill"></i> Save Changes
                    </button>
                </div>

            </form>
        </div>

    </main>

</body>
</html>
