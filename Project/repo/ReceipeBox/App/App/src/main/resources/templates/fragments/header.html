<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

	<header th:fragment="global-header(page)" class="global-header">
		<div class="header-left">
			<a th:href="@{/home}" class="global-logo"> <span
				class="logo-icon">🍳</span> <span class="logo-text">Recipe<span>Box</span></span>
			</a>
		</div>

		<th:block sec:authorize="hasRole('ADMIN')">
			<nav class="header-nav-right">
				<div class="nav-group">
					<a th:href="@{/admin/dashboard}" class="nav-link"
						th:classappend="${page == 'admin-dashboard'} ? 'active'">Dashboard</a>

					<a th:href="@{/admin/recipe/list}" class="nav-link"
						th:classappend="${page == 'recipes'} ? 'active'">Recipes</a> <a
						th:href="@{/admin/ingredient/list}" class="nav-link"
						th:classappend="${page == 'ingredients'} ? 'active'">Ingredients</a>

					<a th:href="@{/allergy/list}" class="nav-link"
						th:classappend="${page == 'allergies'} ? 'active'">Allergies</a> <a
						th:href="@{/admin/users}" class="nav-link"
						th:classappend="${page == 'users'} ? 'active'">Users</a>
				</div>
			</nav>
			<div class="user-profile-controls"
				th:if="${session.loginUser != null}">
				<button type="button" class="profile-dropdown-btn"
					id="adminDropdownBtn">
					<i class="bi bi-person-circle user-avatar-icon"></i> <span
						class="welcome-user-name" th:text="${session.loginUser.name}">Admin</span>
					<i class="bi bi-chevron-down dropdown-chevron"></i>
				</button>

				<div class="profile-dropdown-menu" id="adminDropdownMenu">
					<a th:href="@{/admin/profile}" class="dropdown-item"> <i
						class="bi bi-person"></i> Profile
					</a>
					<div class="dropdown-divider"></div>
					<form th:action="@{/logout}" method="POST" style="margin: 0;">
						<button type="submit" class="dropdown-item logout-text">
							<i class="bi bi-box-arrow-right"></i> Log Out
						</button>
					</form>
				</div>
			</div>
		</th:block>

		<!-- ==================== ၂။ USER HEADER (ROLE_USER ဖြစ်လျှင် ပြမည်) ==================== -->
		<th:block sec:authorize="hasRole('USER')">
			<div class="header-right">
				<nav class="header-nav-right">
					<div class="nav-group">
						<a th:href="@{/user/dashboard}" class="nav-link"
							th:classappend="${page == 'dashboard'} ? 'active'">Dashboard</a>
						<a th:href="@{/user/favorite-recipes}" class="nav-link"
							th:classappend="${page == 'favorites'} ? 'active'">Favorites</a>
						<a th:href="@{/user/bmi}" class="nav-link"
							th:classappend="${page == 'bmi'} ? 'active'">BMI</a> <a
							th:href="@{/user/saved-plans}" class="nav-link"
							th:classappend="${page == 'savedPlans'} ? 'active'">📊 My
							Diet Journey</a>
					</div>
				</nav>
				<div th:if="${session.loginUser != null}"
					class="user-profile-controls">
					<button type="button" class="profile-dropdown-btn"
						id="adminDropdownBtn">
						<i class="bi bi-person-circle user-avatar-icon"></i> <span
							class="welcome-user-name" th:text="${session.loginUser.name}">User</span>
						<i class="bi bi-chevron-down dropdown-chevron"></i>
					</button>

					<div class="profile-dropdown-menu" id="adminDropdownMenu">
						<a th:href="@{/user/profile}" class="dropdown-item"> <i
							class="bi bi-person"></i> Profile
						</a>
						<div class="dropdown-divider"></div>
						<form th:action="@{/logout}" method="POST" style="margin: 0;">
							<button type="submit" class="dropdown-item logout-text">
								<i class="bi bi-box-arrow-right"></i> Log Out
							</button>
						</form>
					</div>
				</div>

			</div>
		</th:block>

		<!-- ==================== ၃။ GUEST HEADER (LOGIN မဝင်ရသေးပါက ပြမည်) ==================== -->
		<th:block sec:authorize="isAnonymous()">
			<nav class="header-nav-right" style="margin-left: auto;">
				<div class="auth-buttons">
					<a th:if="${page != 'login'}" th:href="@{/login}" class="login-btn">Log
						In</a> <a th:if="${page == 'login'}" th:href="@{/signup}"
						class="login-btn">Sign Up</a>
				</div>
			</nav>
		</th:block>

	</header>

</body>
</html>
