<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head
	th:replace="~{fragments/head :: common-head('Forgot Password — RecipeBox')}">
</head>
<body>

  <div th:replace="~{fragments/header :: global-header('forgot-password')}"></div>

  <main class="auth-page-container">
    <div class="split-auth-card">

      <!-- LEFT SIDE: Banner -->
      <div class="auth-banner-side" th:style="'background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.45)), url(' + @{/uploads/login-bg.jpg} + ');'">
        <div class="banner-overlay-content">
          <h2>Reset Your Password</h2>
          <p>Don't worry! Enter your email and set a new password to recover your account.</p>
        </div>
      </div>
      
      <!-- RIGHT SIDE: Form -->
      <div class="auth-form-side">
        <div class="form-wrapper">
          <h2>Forgot Password?</h2>
          <p class="form-subtitle">Enter your registered email address and new password.</p>
          
          <!-- Alert Messages -->
          <div th:if="${error}" style="color: #ef4444; background-color: #fef2f2; border: 1px solid #fee2e2; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">
              <span th:text="${error}"></span>
          </div>
          <div th:if="${success}" style="color: #10b981; background-color: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">
              <span th:text="${success}"></span>
          </div>
          
          <form th:action="@{/forgot-password}" method="POST">
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" id="email" name="email" class="form-control" required placeholder="email@example.com">
            </div>
            
            <div class="form-group">
              <label for="newPassword" class="form-label">New Password</label>
              <input type="password" id="newPassword" name="newPassword" class="form-control" required placeholder="Enter new password">
            </div>
            
            <button type="submit" class="auth-submit-btn">Reset Password →</button>
          </form>
          
          <div class="auth-footer">
            Remembered your password? <a th:href="@{/login}">Back to Login</a>
          </div>
        </div>
      </div>
      
    </div>
  </main>

</body>
</html>
